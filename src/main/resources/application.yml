spring:
  application:
    name: dpp-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

# Swagger UI: http://localhost:8080/swagger-ui.html
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
